<!DOCTYPE html><html><head><meta charset="utf-8"><title>kid</title></head>
<body style="font:14px system-ui;background:#f66;color:#fff"><h2>kid (not resizable)</h2>
<p>This page calls <code>tiny.win.setResizable(false)</code> on load, like the #113 sample.</p>
<p><b>Drag me</b>, then quit and run again. I should come back at 400×300 where you left me, not maximized.</p>
<script>
  tiny.win.setResizable(false).then(() => tiny.api.call('madeFixed'));
</script></body></html>
