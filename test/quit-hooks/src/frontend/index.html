<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px -apple-system,system-ui,sans-serif;margin:18px;color:#222}
label{display:block;margin:6px 0} button{margin:8px 6px 8px 0;font-size:13px}
#log{font:12px ui-monospace,monospace;background:#f4f4f4;padding:8px;height:230px;overflow:auto;white-space:pre-wrap}
h2{margin:0 0 8px}
</style></head><body>
<h2>Quit hooks test (#121)</h2>
<label><input type="checkbox" id="veto" checked> Backend <b>onBeforeQuit</b> cancels the quit</label>
<label><input type="checkbox" id="page"> Page <b>tiny.app.onBeforeQuit</b> asks with a confirm dialog</label>
<label><input type="checkbox" id="hide"> <b>setHideOnClose</b> (close button hides; Dock icon brings it back)</label>
<button id="quit">tiny.quit() (should NOT ask)</button>
<button id="askquit">tiny.quit({ ask: true })</button>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
const add = (s) => { $('log').textContent += s + '\n'; $('log').scrollTop = 1e9; };
let offPage = null;
function go() {
  tiny.api.on('qlog', add);
  $('veto').onchange = (e) => tiny.api.call('setVeto', { on: e.target.checked });
  $('page').onchange = (e) => {
    if (e.target.checked) {
      offPage = tiny.app.onBeforeQuit(async ({ reason }) => {
        await tiny.api.call('qlog', { s: 'PAGE onBeforeQuit reason=' + reason + ' (showing confirm)' });
        const ok = await tiny.dialog.confirm('Really quit?', 'reason: ' + reason);
        await tiny.api.call('qlog', { s: 'PAGE answered ' + (ok ? 'allow' : 'CANCEL') });
        return ok;
      });
      tiny.api.call('qlog', { s: 'page handler registered' });
    } else { offPage?.(); offPage = null; tiny.api.call('qlog', { s: 'page handler removed' }); }
  };
  $('hide').onchange = (e) => { tiny.win.setHideOnClose(e.target.checked); tiny.api.call('qlog', { s: 'hideOnClose = ' + e.target.checked }); };
  $('askquit').onclick = async () => {
    tiny.api.call('qlog', { s: 'tiny.quit({ ask: true }) clicked' });
    const ok = await tiny.quit({ ask: true });
    tiny.api.call('qlog', { s: 'tiny.quit({ ask: true }) resolved ' + ok });
  };
  $('quit').onclick = () => { tiny.api.call('qlog', { s: 'tiny.quit() clicked' }); setTimeout(() => tiny.quit(), 100); };
}
(function wait() { window.tiny ? go() : setTimeout(wait, 50); })();
</script></body></html>
