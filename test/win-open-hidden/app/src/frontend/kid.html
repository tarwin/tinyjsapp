<!DOCTYPE html><html><head><meta charset="utf-8"><title>kid</title></head>
<body style="font:14px system-ui;background:#f66;color:#fff"><h2>kid</h2>
<p>Opened with show: false; this page showed itself once loaded.</p>
<script>
  setTimeout(async () => {
    await tiny.api.call('ranWhileHidden');
    setTimeout(() => {
      tiny.win.show();
      // the page itself must see the show: Windows once kept the webview
      // hidden (black frame) while the HWND reported visible
      setTimeout(() => tiny.api.call('afterShow', document.visibilityState), 700);
    }, 2000);
  }, 500);
</script></body></html>
