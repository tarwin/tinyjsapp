<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>app surface</title></head>
<body>
<h1>app surface test…</h1>
<p>Watch the Dock (macOS) / taskbar button (Windows) / launcher icon (Linux)
while this runs. It minimizes itself briefly (so the attention flash is
observable on Windows) and quits after ~27s.</p>
<script>
// Exercises the app-surface verbs — badge / attention / icon / progress /
// presence — on whatever platform it's running on. The wire plumbing is
// checked automatically; the DECORATIONS THEMSELVES NEED EYES, so each state
// is held for a few seconds. See TODO-verify.md for what should appear where.
//
//   TINYJS_HTML=/abs/path/to/test/appsurface.html tinyjs dev
//
// On macOS use the dev checkout's ./tinyjs — a `tinyjs` on PATH may be an
// installed release without these calls, which would fail on the first line.
const api = { call: (m, p) => window.__invoke(JSON.stringify({ method: m, params: p })) };
window.__emit = () => {};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const say = (m) => api.call('log', { msg: '[surface] ' + m });

// A call that the platform doesn't implement should still RESOLVE (it's a
// no-op there, and capabilities() is how you find out) — never throw.
const ok = (v) => (v === true ? 'ok' : 'FAIL: ' + JSON.stringify(v));

(async () => {
  const r = {};
  try {
    const caps = await tiny.system.capabilities();
    r.os = caps.os;
    // What this machine SAYS it can do. Anything absent is true by convention.
    r.claims = ['badge', 'icon', 'presence', 'progress']
      .map((k) => k + '=' + (caps[k] === undefined ? 'true' : caps[k])).join(' ');

    await say('badge("3") + progress(0.45) — expect a count badge and a bar');
    r.badge = ok(await tiny.app.badge('3'));
    r.progress = ok(await tiny.app.progress(0.45));
    await wait(4000);

    await say('progress(0.9) — the bar should move, badge unchanged');
    r.progressMove = ok(await tiny.app.progress(0.9));
    await wait(3000);

    await say('progress(null) — bar clears, badge SURVIVES');
    r.progressClear = ok(await tiny.app.progress(null));
    await wait(3000);

    // Windows passes FLASHW_TIMERNOFG, which is DEFINED to do nothing while the
    // target window is already in front — so flashing ourselves while focused
    // proves nothing. Minimize first, hold long enough for a few flash cycles
    // (a flash is only distinguishable from a static button by consecutive
    // frames oscillating), then restore, which is also what stops it.
    await say('attention() — bounce (macOS) / flash (Windows) / urgency (Linux)');
    await tiny.win.minimize();
    await wait(1500);
    r.attention = ok(await tiny.app.attention());
    await wait(6000);
    await tiny.win.restore();
    await wait(1500);

    // icon() needs a real file, so only the reset path is automated here —
    // pointing it at a png is a manual check (TODO-verify.md).
    r.iconReset = ok(await tiny.app.icon(''));

    await say('presence("menubar") then back to "normal"');
    r.presenceMenubar = ok(await tiny.app.presence('menubar'));
    await wait(3000);
    r.presenceNormal = ok(await tiny.app.presence('normal'));
    // HOLD: quitting straight after this makes a restored taskbar button and a
    // departed app look identical, which is how this read as unverifiable.
    await wait(4000);

    try {
      await tiny.app.presence('sideways');
      r.presenceBadMode = 'FAIL: bogus mode did not reject';
    } catch (e) { r.presenceBadMode = 'rejects ok'; }

    r.badgeClear = ok(await tiny.app.badge(''));

    // the old names must be gone, not quietly still working
    const stale = ['dock', 'dockIcon', 'setDockVisible'].filter((k) => tiny.app[k] !== undefined);
    r.oldNamesGone = stale.length ? 'FAIL: ' + stale.join(',') : 'ok';

    await api.call('log', { msg: 'SURFACE RESULTS ' + JSON.stringify(r, null, 1) });
  } catch (e) {
    await api.call('log', { msg: 'SURFACE FATAL ' + ((e && e.stack) || e) });
  }
  await api.call('quit');
})();
</script>
</body>
</html>
